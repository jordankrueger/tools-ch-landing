server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Astro static output: each route is /path/index.html
  location / {
    try_files $uri $uri/ $uri.html $uri/index.html /index.html =404;
  }

  # Long-cache Astro's hashed asset bundles
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache HTML — referenced asset hashes change between deploys
  location ~ \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
}
